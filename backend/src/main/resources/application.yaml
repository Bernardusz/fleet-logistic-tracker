spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: template-kotlin

  # R2DBC Reactive Database Configuration
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/${DATABASE_NAME}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    pool:
      enabled: true
      initial-size: 10
      max-size: 30
      max-idle-time: 30m

  # Automatic Schema Initialization (Development Only)
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  # Jackson JSON Serialization Settings
  jackson:
    default-property-inclusion: non_null

# Custom Security & JWT Application Properties
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: 900000        # 15 minutes
  refresh-token-expiration-ms: 604800000    # 7 days

# Server Configuration
server:
  port: 8443
  ssl:
    key-store: classpath:keystore.p12
    key-store-type: PKCS12
    key-store-password: ${KEYSTORE_PASSWORD}
    key-alias: ${KEYSTORE_ALIAS}
  error:
    include-message: ${MESSAGE_MODE}

# Logging Configuration
logging:
  level:
    root: INFO
    io.github.bernardusz.template_kotlin: DEBUG
    org.springframework.security: ${LOGGING_MODE:INFO}
    org.springframework.security.web.authentication.AnonymousAuthenticationFilter: ${AUTH_MODE:OFF}